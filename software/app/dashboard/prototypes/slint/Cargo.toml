[package]
name = "dashboard-slint-proto"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "software-renderer-systemfonts"] }
serde_json = "1"
png = "0.17"

[build-dependencies]
slint-build = "1.19"

[profile.release]
debug = false
